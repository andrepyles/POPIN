<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 16px Arial, sans-serif; fill: #475569; }
      .group-title { font: 700 18px Arial, sans-serif; fill: #334155; }
      .box-title { font: 700 17px Arial, sans-serif; fill: #0f172a; }
      .field { font: 14px Arial, sans-serif; fill: #334155; }
      .note { font: 14px Arial, sans-serif; fill: #475569; }
      .key { font-weight: 700; fill: #1d4ed8; }
    </style>
  </defs>

  <rect width="1400" height="850" fill="#f8fafc"/>
  <text x="60" y="58" class="title">POPIN — mapa de relacionamento das tabelas</text>
  <text x="60" y="88" class="subtitle">O vínculo substantivo está entre o corpus de discursos e os resultados de pontuação.</text>

  <!-- Core -->
  <rect x="45" y="125" width="840" height="430" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="75" y="160" class="group-title">Núcleo POPIN</text>

  <!-- discourses -->
  <rect x="85" y="205" width="300" height="255" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="85" y="205" width="300" height="45" rx="12" fill="#dbeafe"/>
  <text x="110" y="234" class="box-title">discourses</text>
  <text x="110" y="282" class="field key">PK: id</text>
  <text x="110" y="310" class="field">iso3</text>
  <text x="110" y="336" class="field">leader_name</text>
  <text x="110" y="362" class="field">discourse_date / year</text>
  <text x="110" y="388" class="field">discourse</text>
  <text x="110" y="414" class="field">word_count</text>
  <text x="110" y="440" class="field">dtype (classificação congelada)</text>

  <!-- scores -->
  <rect x="500" y="190" width="340" height="300" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="500" y="190" width="340" height="45" rx="12" fill="#dbeafe"/>
  <text x="525" y="219" class="box-title">scores</text>
  <text x="525" y="267" class="field key">PK lógica: discourse_id + execução</text>
  <text x="525" y="295" class="field">discourse_id → discourses.id</text>
  <text x="525" y="321" class="field">model_id</text>
  <text x="525" y="347" class="field">prompt_id (v4 / neutral)</text>
  <text x="525" y="373" class="field">provider (ex.: decart)</text>
  <text x="525" y="399" class="field">6 dimensões + final_score</text>
  <text x="525" y="425" class="field">n_chunks / raw_json</text>
  <text x="525" y="451" class="field">scored_at</text>

  <!-- jobs -->
  <rect x="320" y="490" width="280" height="100" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <rect x="320" y="490" width="280" height="38" rx="12" fill="#e2e8f0"/>
  <text x="345" y="515" class="box-title">jobs</text>
  <text x="345" y="550" class="field">job_id · status · last_row</text>
  <text x="345" y="574" class="field">modelo · timestamps</text>

  <!-- Main relationship -->
  <line x1="385" y1="330" x2="500" y2="330" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="398" y="315" class="note">1 : N scores</text>
  <text x="397" y="355" class="note">id = discourse_id</text>
  <line x1="460" y1="490" x2="610" y2="490" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-gray)"/>
  <text x="405" y="478" class="note">controle da execução</text>

  <!-- Raw sources -->
  <rect x="45" y="620" width="840" height="175" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="75" y="655" class="group-title">Fontes raw — preservadas sem relacionamento no DuckDB</text>
  <text x="75" y="681" class="note">Sem crosswalk, médias ou tabelas derivadas.</text>

  <rect x="75" y="705" width="240" height="65" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="98" y="733" class="box-title">raw_gpd_long</text>
  <text x="98" y="756" class="field">5.552 linhas · 19 colunas</text>

  <rect x="345" y="705" width="240" height="65" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="368" y="733" class="box-title">raw_gpd_wide</text>
  <text x="368" y="756" class="field">361 linhas · 37 colunas</text>

  <rect x="615" y="705" width="240" height="65" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="638" y="733" class="box-title">raw_lallpi_index</text>
  <text x="638" y="756" class="field">524 linhas · 34 colunas</text>

  <!-- Artifacts -->
  <rect x="955" y="125" width="390" height="430" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="985" y="160" class="group-title">Artefatos de auditoria</text>
  <rect x="1000" y="220" width="300" height="170" rx="12" fill="#ffffff" stroke="#f97316" stroke-width="2"/>
  <rect x="1000" y="220" width="300" height="45" rx="12" fill="#ffedd5"/>
  <text x="1025" y="249" class="box-title">JSONL por execução</text>
  <text x="1025" y="295" class="field">uma linha por discurso</text>
  <text x="1025" y="321" class="field">modelo / prompt / provedor</text>
  <text x="1025" y="347" class="field">scores e custo</text>
  <text x="1025" y="373" class="field">uso por chunk</text>
  <line x1="840" y1="330" x2="1000" y2="330" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-gray)"/>
  <text x="855" y="315" class="note">origem auditável</text>

  <text x="985" y="465" class="note">O JSONL é mantido fora das tabelas raw</text>
  <text x="985" y="489" class="note">e pode ser reimportado sem duplicação.</text>
  <text x="985" y="535" class="note">GPD/LALLPI não recebem FK para POPIN.</text>

  <!-- Legend -->
  <line x1="985" y1="665" x2="1050" y2="665" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1065" y="670" class="note">relacionamento lógico</text>
  <line x1="985" y1="705" x2="1050" y2="705" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-gray)"/>
  <text x="1065" y="710" class="note">controle / origem, não FK substantiva</text>
</svg>
